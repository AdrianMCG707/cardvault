services:
  postgres:
    image: postgres:16-alpine
    container_name: cardvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardvault
      POSTGRES_PASSWORD: cardvault_dev_password
      POSTGRES_DB: cardvault
    ports:
      - "5433:5432"
    volumes:
      - cardvault_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cardvault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cardvault_redis_data:/data

volumes:
  cardvault_postgres_data:
  cardvault_redis_data: